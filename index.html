<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juntador de PDFs - Intranet</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteca pdf-lib para manipular PDFs diretamente no navegador -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>📄 Juntador de PDFs</h1>
            <p>Selecione os arquivos PDF para unir em um único documento.</p>
        </header>

        <main>
            <!-- ÁREA DE UPLOAD -->
            <div class="upload-area" id="drop-zone">
                <input type="file" id="file-input" multiple accept="application/pdf">
                <label for="file-input" class="upload-label">
                    <span class="icon">📁</span>
                    <span>Clique para selecionar ou arraste os PDFs aqui</span>
                </label>
            </div>

            <!-- LISTA DOS ARQUIVOS SELECIONADOS -->
            <div class="file-list-container">
                <h3>Arquivos Selecionados:</h3>
                <ul id="file-list" class="file-list">
                    <li class="empty-msg">Nenhum arquivo selecionado ainda.</li>
                </ul>
            </div>

            <!-- BOTÃO DE AÇÃO -->
            <div class="actions">
                <button id="merge-btn" class="btn-primary" disabled>
                    Juntar PDFs e Baixar
                </button>
            </div>
        </main>

        <footer>
            <p>Ferramenta Interna - Processamento local 100% seguro</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
